<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>رتّب | RATTIB</title>
<style>
:root{--bg:#FAF7F2;--b2:#F1ECE2;--cd:#fff;--tx:#23211D;--t2:#68635B;--t3:#938D82;--bd:#E4DDD0;--ac:#48685A;--as:#E5EFEA;--at:#fff;--dg:#B84738;--ds:#FBEAE8;--wn:#C27824;--ws:#FDF3E4;--sc:#387654;--ss:#E4F3EA;--r:14px}
[data-theme=dark]{--bg:#171816;--b2:#222420;--cd:#262925;--tx:#EFECE6;--t2:#B0ABA1;--t3:#7F7A70;--bd:#373B35;--ac:#689480;--as:#26362F;--at:#121412;--dg:#E06C5E;--ds:#3A2320;--wn:#E09F49;--ws:#382D1E;--sc:#58A67C;--ss:#21372B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif}
body{overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none;outline:0}
button{cursor:pointer}
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--ac);color:var(--at);display:grid;place-items:center;font-weight:800}
.bt{font-weight:800;font-size:1.2rem;flex:1}
header select{width:auto;max-width:130px;font-size:.85rem;padding:8px}
.ib{min-width:40px;height:40px;border-radius:10px;background:var(--b2)}
main{max-width:720px;margin:0 auto;padding:14px}
.card,.ic{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,var(--as),var(--cd));border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px}
.hs{font-weight:700;margin-bottom:12px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;font-weight:600;background:var(--b2);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--ac);color:var(--at);border-color:var(--ac)}
.btn.d{background:var(--ds);color:var(--dg);border-color:var(--dg)}
.sm{min-height:42px;padding:6px 14px;font-size:.88rem;border-radius:10px}
.blk{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:.88rem}
.tile b{font-size:1.5rem;color:var(--ac)}
h2{font-size:1.02rem;margin:16px 0 8px}
.fg{margin-bottom:12px}.fg label{display:block;font-size:.85rem;color:var(--t2);font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--b2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:flex-start}.row input{flex:1}.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;align-items:center}
.chip{padding:6px 13px;border-radius:99px;background:var(--b2);color:var(--t2);font-size:.83rem;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--at)}
.bg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--b2);color:var(--t2)}
.bg.a{background:var(--as);color:var(--ac)}.bg.w{background:var(--ws);color:var(--wn)}.bg.r{background:var(--ds);color:var(--dg)}.bg.g{background:var(--ss);color:var(--sc)}
.tt{font-weight:700;word-break:break-word}.tt.dn{text-decoration:line-through;color:var(--t3)}
.bd{white-space:pre-wrap;word-break:break-word;color:var(--t2);font-size:.9rem;margin:4px 0}
.mt{display:flex;flex-wrap:wrap;gap:5px;font-size:.75rem;color:var(--t3);margin-top:6px}
.ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--ac);flex-shrink:0;color:var(--at);font-weight:800;margin-top:2px}.chk.on{background:var(--ac)}
.pr{height:8px;background:var(--b2);border-radius:9px;overflow:hidden;margin-top:8px}.pr i{display:block;height:100%;background:var(--ac)}
.emp{text-align:center;padding:24px 14px;border:1px dashed var(--bd);border-radius:var(--r);color:var(--t3);margin-bottom:10px}
nav{position:fixed;bottom:0;right:0;left:0;z-index:50;background:var(--cd);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:8px 0 6px;font-size:.7rem;font-weight:600;color:var(--t3);display:flex;flex-direction:column;align-items:center}
nav button b{font-size:1.25rem;line-height:1.2}nav .on{color:var(--ac)}
#cvw{border:2px solid var(--bd);border-radius:var(--r);overflow:hidden;background:#fff;touch-action:none}
#cv{display:block;width:100%;height:320px;touch-action:none}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;padding:0}.sw.on{border-color:var(--tx);transform:scale(1.15)}
#mb{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}#mb.o{display:flex}
#md{width:100%;max-width:680px;max-height:90vh;overflow-y:auto;background:var(--cd);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#ts{position:fixed;top:12px;left:12px;right:12px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.to{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.88rem;max-width:460px}.to.error{background:var(--dg);color:#fff}.to.success{background:var(--sc);color:#fff}
audio{width:100%;margin-top:6px}
#md{max-height:85dvh;animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
main>*{animation:fi .18s ease-out}.to{animation:fi .2s}@keyframes fi{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
details>summary{list-style:none;cursor:pointer;color:var(--ac);font-weight:600;padding:8px 0}details>summary::-webkit-details-marker{display:none}.stats{color:var(--t2);font-size:.9rem;margin-bottom:6px}.hint{background:var(--as);border-radius:var(--r);padding:14px;margin-bottom:12px}
#rb{position:fixed;right:10px;left:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:60;display:none;align-items:center;gap:8px;background:var(--cd);border:2px solid var(--dg);border-radius:14px;padding:8px 12px;box-shadow:0 4px 16px rgba(0,0,0,.2)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--dg);animation:bl 1s infinite}@keyframes bl{50%{opacity:.25}}
</style>
</head>
<body>
<header><button class="ib" id="bk" data-a="back" style="display:none" aria-label="رجوع">→</button><div class="logo">ر</div><div class="bt">رتّب</div><select id="sp"></select><button class="ib" data-a="th">◐</button></header>
<main id="app"></main>
<nav id="nv"></nav>
<div id="rb"></div>
<div id="mb"><div id="md"></div></div>
<div id="ts"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const TY={idea:'فكرة',note:'ملاحظة',task:'مهمة',project:'مشروع',audio:'تسجيل',draw:'رسمة'};
const ST={new:'جديدة',doing:'قيد التنفيذ',done:'مكتملة'},FQ={'':'عامة',day:'يومية',week:'أسبوعية',month:'شهرية',year:'سنوية'},PS={active:'نشط',paused:'متوقف',done:'مكتمل'};
const FF={'':'كل الفترات',day:'يومية',week:'أسبوعية',month:'شهرية',year:'سنوية'},SF={'':'كل الحالات',new:'جديدة',doing:'قيد التنفيذ',done:'مكتملة',late:'متأخرة'};
const PR={'':'بدون',h:'عالية',m:'متوسطة',l:'منخفضة'},PD={'':'كل المواعيد',today:'اليوم',week:'خلال 7 أيام',month:'خلال 30 يوماً',year:'خلال سنة'};
const NV=[['home','الرئيسية','⌂'],['idea','أفكار','✦'],['task','مهام','☑'],['project','مشاريع','◧'],['note','ملاحظات','✎'],['more','المزيد','☰']];
let lastErr,FR,sy,lastJ,lastT=Date.now(),acc=0,pzd=0,pend=null,db,D=[],FO,rec,chunks,tm,t0,S={stk:[],v:'home',q:'',f:{},sp:'',st:[],col:'#23211D',sz:4,ar:0,pid:'',rec:0,bg:null};
const toast=(m,k)=>{const e=document.createElement('div');e.className='to '+(k||'');e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),k=='error'?4800:2300)};
const mo=h=>{$('#md').innerHTML=h;$('#mb').classList.add('o')},cm=()=>$('#mb').classList.remove('o');
$('#mb').onclick=e=>{if(e.target.id=='mb')cm()};
const dlg=(msg,btns,danger)=>new Promise(r=>{mo(`<p class="bd" style="font-size:1rem;color:var(--tx)">${esc(msg)}</p><div class="ac" style="border:0">${btns.map((b,i)=>`<button class="btn blk ${danger||i?'d':'p'}" data-i="${i}">${b}</button>`).join('')}<button class="btn blk" data-i="-1">إلغاء</button></div>`);$('#md').onclick=e=>{const b=e.target.closest('[data-i]');if(b){cm();$('#md').onclick=null;r(+b.dataset.i)}}});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r.result);t.onerror=t.onabort=()=>no(t.error)});
const put=(o,s='items')=>tx(s,'readwrite',x=>x.put(o)),rm=(id,s='items')=>tx(s,'readwrite',x=>x.delete(id)),all=(s='items')=>tx(s,'readonly',x=>x.getAll()),get=(id,s)=>tx(s,'readonly',x=>x.get(id));
async function sv(o,quiet){try{o.upd=Date.now();await put(o);const i=D.findIndex(x=>x.id==o.id);if(i<0)D.push(o);else D[i]=o;if(!quiet)toast('تم الحفظ ✓','success');return 1}catch(e){toast('فشل الحفظ: '+((e&&e.message)||'خطأ'),'error');return 0}}
const td=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=t=>new Date(t).toLocaleDateString('ar',{day:'numeric',month:'short'});
const fm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const L=(t,a)=>D.filter(x=>x.type==t&&!!x.arch==!!a&&(!S.sp||x.sp==S.sp)).sort((a,b)=>b.created-a.created);
const hit=x=>!S.q||((x.title||'')+' '+(x.body||'')+' '+(x.goals||'')).toLowerCase().includes(S.q.toLowerCase());
const pn=id=>(D.find(x=>x.id==id)||{}).title||'';
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addF=(s,f,a)=>{const d=new Date(s+'T12:00:00');if(f=='day')d.setDate(d.getDate()+1);if(f=='week')d.setDate(d.getDate()+7);if(f=='month'||f=='year'){const dy=a||d.getDate();d.setDate(1);if(f=='month')d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);d.setDate(Math.min(dy,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return d.toISOString().slice(0,10)};
const inPd=x=>{if(!x.due||x.st=='done')return false;const t=td();return x.due>=t&&x.due<=({today:t,week:addD(t,6),month:addD(t,29),year:addD(t,364)})[S.f.pd]};
const pri=x=>({h:0,m:1,l:2})[x.pr]??3;
async function nextRec(x){const a=x.dom||+(x.due||td()).slice(8);let n=addF(x.due||td(),x.fq,a);while(n<=td())n=addF(n,x.fq,a);const root=x.root||x.id,id='r_'+root+'_'+n;if(D.some(y=>y.id==id))return;if(await sv({...x,id,root,dom:a,st:'new',due:n,arch:0,created:Date.now()},1))toast('أُنشئت المهمة المتكررة التالية بتاريخ '+n,'success')}
const late=x=>x.type=='task'&&x.st!='done'&&x.due&&x.due<td();
const prog=p=>{const t=D.filter(x=>x.type=='task'&&x.pj==p.id&&!x.arch);return t.length?Math.round(t.filter(x=>x.st=='done').length/t.length*100):0};
const prim=x=>x.arch?['rs','استعادة','p']:({project:['open','فتح','p'],audio:['play','▶ تشغيل','p'],draw:['view','عرض','p'],idea:['toTask','← حوّلها لمهمة','p'],note:['edit','تعديل'],task:x.st=='new'?['doing','بدء التنفيذ']:['edit','تعديل']})[x.type];
const acts=x=>{const t=x.type;return x.arch?[['rs','استعادة'],['edit','تعديل'],['del','حذف نهائي','d']]:[['edit','تعديل'],...(t=='task'&&!x.par?[['sub','إضافة مهمة فرعية']]:[]),...(t=='task'&&x.st!='done'?[['snz','تأجيل إلى الغد'],['snw','تأجيل أسبوعاً']]:[]),...(t=='task'&&x.st=='new'?[['doing','بدء التنفيذ']]:[]),...(t=='idea'?[['toTask','حوّلها إلى مهمة'],['toNote','حوّلها إلى ملاحظة'],['toProj','حوّلها إلى مشروع'],['later',x.later?'إلغاء التأجيل':'تأجيل الفكرة']]:[]),['arch','أرشفة'],['del','حذف نهائي','d']]};
function card(x,showT){
 const t=x.type,A=(a,l,c='')=>`<button class="btn sm ${c}" data-a="${a}" data-id="${x.id}">${l}</button>`;
 const m=[showT?`<span class="bg a">${TY[t]}</span>`:'',`<span>${fd(x.created)}</span>`];
 if(x.pj&&pn(x.pj))m.push(`<span class="bg">◧ ${esc(pn(x.pj))}</span>`);
 if(t=='task'){if(x.due)m.push(`<span class="bg ${late(x)?'r':''}">${late(x)?'متأخرة: ':''}${esc(x.due)}</span>`);m.push(`<span class="bg ${x.st=='done'?'g':x.st=='doing'?'w':''}">${ST[x.st]}</span>`);if(x.fq)m.push(`<span class="bg">↻ ${FQ[x.fq]}</span>`);if(x.pr)m.push(`<span class="bg ${x.pr=='h'?'r':x.pr=='m'?'w':''}">أولوية ${PR[x.pr]}</span>`)}
 if(t=='idea'&&x.later)m.push('<span class="bg w">مؤجلة</span>');
 if(t=='project'){m.push(`<span class="bg a">${PS[x.ps]}</span>`);if(x.ed)m.push(`<span class="bg">حتى ${esc(x.ed)}</span>`)}
 if(t=='audio')m.push(`<span class="bg">⏱ ${fm(x.dur||0)}</span>`);
 const b=(x.body||'').slice(0,260);
 const pm=prim(x),ac=(pm?`<button class="btn sm ${pm[2]||''}" data-a="${pm[0]}" data-id="${x.id}">${pm[1]}</button>`:'')+`<button class="btn sm" data-a="mn" data-id="${x.id}">⋯ خيارات</button>`;
 return `<div class="ic"><div class="row">${t=='task'?`<button class="chk ${x.st=='done'?'on':''}" data-a="tg" data-id="${x.id}">${x.st=='done'?'✓':''}</button>`:''}<div class="grow" ${['idea','note','task','project'].includes(t)?`data-a="${t=='project'?'open':'edit'}" data-id="${x.id}"`:''}>${x.title?`<div class="tt ${x.st=='done'?'dn':''}">${esc(x.title)}</div>`:''}${b?`<div class="bd">${esc(b)}</div>`:''}${t=='draw'?`<img src="${esc(x.img)}" style="width:100%;max-height:160px;object-fit:contain;background:#fff;border-radius:8px">`:''}${t=='project'?`<div class="pr"><i style="width:${prog(x)}%"></i></div><div class="mt">${prog(x)}% مكتمل</div>`:''}${subs(x)}<div class="mt">${m.join('')}</div><div id="au_${x.id}"></div></div></div><div class="ac">${ac}</div></div>`}
const ch=(k,o)=>`<div class="chips">${Object.entries(o).map(([a,b])=>`<button class="chip ${(S.f[k]||'')==a?'on':''}" data-a="fl" data-k="${k}" data-v="${a}">${b}</button>`).join('')}</div>`;
const tp=(t,x='')=>`<div class="row"><input id="q" placeholder="بحث…" value="${esc(S.q)}"><button class="btn p" data-a="add" data-t="${t}">+ جديد</button></div>${x}<div style="height:10px"></div><div id="list"></div>`;
function items(){let r=L(S.v).filter(hit);if(S.v=='task')r=r.filter(x=>!x.par);if(S.v=='idea'){if(S.f.lt=='y')r=r.filter(x=>x.later);else if(S.f.lt=='n')r=r.filter(x=>!x.later)}if(S.v=='task'){if(S.f.fq)r=r.filter(x=>x.fq==S.f.fq);if(S.f.pd)r=r.filter(inPd);if(S.f.pf)r=r.filter(x=>x.pr==S.f.pf);const s=S.f.st;if(s=='late')r=r.filter(late);else if(s)r=r.filter(x=>x.st==s);r.sort((a,b)=>((a.st=='done')-(b.st=='done'))||((a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:pri(a)-pri(b)))}return r}
const V={},LS={};
